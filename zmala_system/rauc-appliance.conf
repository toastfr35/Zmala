[Unit]
Description=Zmala RAUC inactive-slot installer
After=dbus.service
Requires=dbus.service
ConditionPathExists=/run/zmalacall-updater/rauc.conf

[Service]
# @llr LLR-TERM-MAINT-062
Type=dbus
BusName=de.pengutronix.rauc
ExecStart=/usr/bin/rauc --conf=/run/zmalacall-updater/rauc.conf --mount=/run/rauc/mnt service
RuntimeDirectory=rauc/mnt
MountFlags=slave
TimeoutStopSec=60s
