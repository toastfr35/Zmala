name: Sign verified Terminal bundles
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
    secrets:
      ZMALA_RAUC_SIGNING_KEY:
        required: true
permissions:
  contents: read
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: terminal-system-bundle-signing
    runs-on: ubuntu-24.04
    container: debian:13-slim
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install signing tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends rauc squashfs-tools openssl python3 zstd ca-certificates
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'sign'
        with:
          name: terminal-system-signing-inputs
          path: ${{ runner.temp }}/system-inputs
      - name: Recheck the transferred slot archives
        if: inputs.mode == 'sign'
        shell: bash
        working-directory: ${{ runner.temp }}/system-inputs
        run: |
          test "$(wc -l < SHA256SUMS)" -eq 2
          for slot in A B; do
            grep -Eq "^[a-f0-9]{64}  ${slot}\.tar\.zst$" SHA256SUMS
          done
          sha256sum --check --strict SHA256SUMS
      - name: Verify signing key and produce signed bundles
        env:
          RAUC_KEY: ${{ secrets.ZMALA_RAUC_SIGNING_KEY }}
          SIGN_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z $RAUC_KEY ]]; then
            echo '::error::The release environment did not supply the RAUC signing key'
            exit 1
          fi
          umask 077
          key=$(mktemp /dev/shm/zmala-rauc.XXXXXXXX)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RAUC_KEY" > "$key"
          unset RAUC_KEY
          cert=zmala_images/system-update-keyring.pem
          cmp <(openssl pkey -in "$key" -pubout) <(openssl x509 -in "$cert" -pubkey -noout)
          mkdir "$RUNNER_TEMP/probe"
          printf '[update]\ncompatible=zmala-signing-check\nversion=0.0.1\n\n[bundle]\nformat=verity\n\n[image.test]\nfilename=probe.img\n' > "$RUNNER_TEMP/probe/manifest.raucm"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe/probe.img" bs=4096 count=16 status=none
          rauc --cert="$cert" --key="$key" bundle "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.raucb"
          rauc --keyring="$cert" info --output-format=json-2 "$RUNNER_TEMP/probe.raucb"
          if [[ $SIGN_MODE == sign ]]; then
            python3 -m zmala_images.sign_system_bundles "$RUNNER_TEMP/system-inputs" "$RUNNER_TEMP/system-bundles" "$cert" "$key"
            (cd "$RUNNER_TEMP/system-bundles"; sha256sum ZmalaTerminal-System-*.raucb > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'sign'
        with:
          name: signed-terminal-system-bundles
          path: ${{ runner.temp }}/system-bundles/
          if-no-files-found: error
          compression-level: 0
