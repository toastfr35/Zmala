name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up verification dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
      - run: make requirements
      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements/output/
          if-no-files-found: error
      - name: Install Linux runtime and display test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil python3-pil.imagetk python3-gi python3-gi-cairo python3-cairo python3-websocket gir1.2-pango-1.0 xvfb xauth nftables iproute2 fdisk util-linux e2fsprogs libubootenv-tool
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/zmala"
          "$RUNNER_TEMP/zmala/bin/pip" install -r requirements-dev.txt -r build_tools/doorstop-requirements.txt
          echo "$RUNNER_TEMP/zmala/bin" >> "$GITHUB_PATH"
      - run: make lint check test-llt test-hlt test-adhoc
      - name: Storage and host HLTs in Linux namespaces
        run: |
          sudo "$(command -v python)" -m unittest discover -s tests/server/HLT -t .
          sudo "$(command -v python)" -m unittest discover -s tests/terminal/HLT -t .
