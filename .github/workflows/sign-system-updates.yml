name: Sign Terminal system updates
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check-key, sign]
        default: check-key
      draft_id:
        description: ID of the draft release holding both qualified input archives
        type: string
      slot_a_sha256:
        description: SHA-256 of ZmalaTerminal-System-Inputs-A.tar.zst
        type: string
      slot_b_sha256:
        description: SHA-256 of ZmalaTerminal-System-Inputs-B.tar.zst
        type: string
permissions:
  contents: read
concurrency:
  group: terminal-system-release
jobs:
  stage:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'sign'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Stage qualified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_id }}
          SLOT_A_SHA256: ${{ inputs.slot_a_sha256 }}
          SLOT_B_SHA256: ${{ inputs.slot_b_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $DRAFT_ID =~ ^[1-9][0-9]*$ && $SLOT_A_SHA256 =~ ^[a-f0-9]{64}$ && $SLOT_B_SHA256 =~ ^[a-f0-9]{64}$ ]]
          api="repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          [[ $(gh api "$api" --jq .draft) == true ]]
          mkdir "$RUNNER_TEMP/system-inputs"
          for slot in A B; do
            name="ZmalaTerminal-System-Inputs-$slot.tar.zst"
            id=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\") | .id")
            [[ $id =~ ^[1-9][0-9]*$ ]]
            path="$RUNNER_TEMP/system-inputs/$slot.tar.zst"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "$path"
            digest_var="SLOT_${slot}_SHA256"
            printf '%s  %s\n' "${!digest_var}" "$path" | sha256sum --check --strict
          done
          printf '%s  A.tar.zst\n%s  B.tar.zst\n' "$SLOT_A_SHA256" "$SLOT_B_SHA256" > "$RUNNER_TEMP/system-inputs/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-system-signing-inputs
          path: ${{ runner.temp }}/system-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  sign:
    needs: stage
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.stage.result == 'success' || (inputs.mode == 'check-key' && needs.stage.result == 'skipped')) }}
    uses: ./.github/workflows/sign-terminal-bundles.yml
    with:
      mode: ${{ inputs.mode }}
    secrets:
      ZMALA_RAUC_SIGNING_KEY: ${{ secrets.ZMALA_RAUC_SIGNING_KEY }}
