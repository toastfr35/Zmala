text: The discovery service shall use bounded RAUC signature inspection with the
  installed public keyring and fixed release origin. Accept only newer verity bundles for the inactive slot
  with a complete boot and root pair and no bundle hooks or handlers. Persist
  the verification outcome once per local calendar day. Provide the verified
  offer to the separate maintenance coordinator. Compare the whole appliance
  release version, including a date-based version, independently of the app
  version. An OS-only release may contain the same app version.
verification: Reject mismatched slots, hook-bearing and incomplete pairs, old
  system versions and malformed identity. Verify one check per day, catch-up,
  backwards-date suppression and bounded signed inspection invocation. Check
  discovery of a newer dated OTA release with the same app version.
